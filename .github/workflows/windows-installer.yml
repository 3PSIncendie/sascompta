# Build installateur Windows (NSIS + MSI) — runner windows-latest (WebView2 + MSVC).
# Artefacts: .exe (NSIS), .msi, signatures .sig.
# Sur tag v* : GitHub Release via tauri-action (+ latest.json pour l’updater).
#
# Secrets requis pour signer les artefacts updater :
#   TAURI_SIGNING_PRIVATE_KEY          (obligatoire)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD (optionnel, si la clé est protégée)

name: Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-windows.ps1"
      - ".github/workflows/windows-installer.yml"

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Require updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY manquant. Voir docs/auto-update.md — générer une clé (tauri signer generate) et l’ajouter aux secrets du dépôt."
            exit 1
          fi

      # Retry: Tauri NSIS bundling downloads nsis_tauri_utils.dll from GitHub
      # Releases and occasionally hits transient 504s after a green compile.
      - name: Build Windows bundles (push / PR / dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "::group::build:windows attempt ${attempt}/3"
            if npm run build:windows; then
              echo "::endgroup::"
              exit 0
            fi
            status=$?
            echo "::endgroup::"
            echo "::warning::build:windows failed (exit ${status}) on attempt ${attempt}"
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 20))
          done

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: sascompta-windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.sig
          if-no-files-found: error
          retention-days: 30

      - name: Build + publish GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: SasCompta ${{ github.ref_name }}
          releaseBody: |
            Installateurs Windows (NSIS + MSI) et artefacts d’auto-update (`latest.json`, signatures `.sig`).

            Après installation, SasCompta vérifie les mises à jour au démarrage ; un bouton manuel est disponible dans la barre latérale.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          projectPath: .
          args: --target x86_64-pc-windows-msvc --bundles nsis,msi

      # L’updater desktop fait un GET non authentifié. Sur un dépôt privé, GitHub
      # répond 404 même si la Release existe → « impossible de vérifier les mises à jour ».
      - name: Verify latest.json is publicly reachable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          LATEST_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
        run: |
          set -euo pipefail
          code=""
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/sascompta-latest.json -w "%{http_code}" -L "$LATEST_URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "OK: latest.json public (HTTP 200)"
              head -c 400 /tmp/sascompta-latest.json || true
              echo
              exit 0
            fi
            echo "tentative $i: HTTP $code — nouvel essai dans 10s…"
            sleep 10
          done
          echo "::error::latest.json inaccessible sans authentification (HTTP ${code}). L’updater Tauri utilise un GET anonyme vers ${LATEST_URL}. Rendez le dépôt public (Settings → Danger Zone → Change visibility) ou hébergez latest.json + installateurs sur une URL publique, puis republiez le tag."
          exit 1
